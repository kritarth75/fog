name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests (core + backend)
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Backend smoke test
        run: |
          node backend/src/server.js &
          for i in $(seq 1 20); do
            curl -fs http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "Backend did not become healthy" && exit 1
